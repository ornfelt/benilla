[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["sam <samuv.eth@gmail.com>"]

# A version two crates share is pinned in `[workspace.dependencies]`; feature additions stay per
# crate. `image` stays per-crate: its consumers differ on default features, and a member cannot
# turn off default features that a workspace entry enables.
# `too_many_arguments` is off: a Bevy system's parameter list is its dependency declaration.
[workspace.lints.clippy]
too_many_arguments = "allow"

[workspace.dependencies]
anyhow = "1.0.102"
# bevy's default features spelled out without `audio`: `2d`, `3d` and `ui` each pull `bevy_audio`
# and `vorbis`, and the client mixes through kira. Add a feature by name, never `2d`/`3d`/`ui`; a
# plugin that takes bevy with its default features brings the audio stack back too.
# `default_app`, `default_platform`, `ui_api` and `ui_bevy_render` are spelled out without winit,
# since the gfx library owns the window: `bevy_winit`, `custom_cursor` (in `default_app`, which
# `ui_api` takes), `x11`, `wayland` and `android-game-activity` each enable it. `bevy_window`'s own
# `custom_cursor` comes on through `benilla-gfx`. bevy_egui (dev builds) still links the
# bevy_winit crate, not its plugin, until it is trimmed.
bevy = { version = "0.18.1", default-features = false, features = [
    "async_executor",
    "bevy_asset",
    "bevy_input_focus",
    "bevy_log",
    "bevy_state",
    "bevy_window",
    "reflect_auto_register",
    "std",
    "android_shared_stdcxx",
    "bevy_gilrs",
    "default_font",
    "multi_threaded",
    "webgl2",
    "sysinfo_plugin",
    "2d_bevy_render",
    "3d_bevy_render",
    "bevy_ui",
    "bevy_ui_render",
    "scene",
    "picking",
] }
clap = { version = "4.6.1", features = ["derive"] }
sha1 = "0.10.6"

# lua-src builds the addon VM's Lua 5.1.5, patched to accept exactly the 1.12 client's grammar;
# the hunks and the command that checks them: `third_party/lua-src/BENILLA.md`.
[patch.crates-io]
lua-src = { path = "third_party/lua-src" }
# kira 0.12.1, patched to compute spatial gains and the volume tween per output chunk and
# interpolate them, not per sample frame (`third_party/kira/BENILLA.md`).
kira = { path = "third_party/kira" }
# Bevy 0.18.1 and the Bevy plugins benilla builds, vendored to be trimmed to what benilla uses
# (`third_party/bevy/BENILLA.md`).
bevy = { path = "third_party/bevy/bevy" }
bevy_a11y = { path = "third_party/bevy/bevy_a11y" }
bevy_animation = { path = "third_party/bevy/bevy_animation" }
