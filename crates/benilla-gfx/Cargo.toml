[package]
name = "benilla-gfx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The gfx DLL backend: the window, input and every draw through the gfx library"

[lints]
workspace = true

[features]
# bevy_egui's contexts drawn through gfx (`egui.rs`): the `dev` debug panel's.
egui = ["dep:bevy_egui", "dep:bevy_winit"]

[dependencies]
bevy.workspace = true
# Only for its `custom_cursor`, which bevy's own feature of that name turns on only with winit:
# the cursor images `window.rs` hands the gfx window.
bevy_window = { version = "0.18.1", default-features = false, features = ["custom_cursor"] }
bevy_egui = { version = "0.39", optional = true }
# bevy_egui links the bevy_winit crate (not its plugin), which must match `bevy_window`'s
# `custom_cursor` to compile. Nothing adds `WinitPlugin`.
bevy_winit = { version = "0.18.1", optional = true, default-features = false, features = [
    "custom_cursor",
] }
# The compiled `.gfx` shader families, embedded so no build-machine path reaches the binary.
include_dir = "0.7"
# Only its `noop` backend: the stand-in `RenderDevice` of `noop_device.rs`. No GPU, no surface.
wgpu = { workspace = true, features = ["noop"] }

# `parity wgpu|gfx`: one scene through either path, for the numeric A/B.
[[example]]
name = "parity"
